#
# shorewall-nft global configuration.
#
# This is the skeleton installed on a fresh install. It sets a couple of safe
# defaults and leaves the firewall disabled until you configure it. Edit it,
# then define zones, interfaces and a policy.
#
# Every setting shorewall-nft acts on is described in docs/settings.md and in
# the shorewall.conf(5) man page. Settings not listed here keep their built-in
# defaults. A setting this implementation does not act on is read and ignored,
# never a hard error, so a configuration carried over from Shorewall on
# iptables still compiles.
#
# Run 'shorewall init' for a guided setup that writes a working config for a
# standalone host, a gateway, or a three-zone firewall.

# The service does not start the firewall until this is Yes. A fresh install
# ships No so an unconfigured box is not left with an empty policy in force.
STARTUP_ENABLED=No

# On turns IP forwarding on (a router or gateway), Off turns it off (a single
# host), Keep leaves the kernel setting as it is.
IP_FORWARDING=Keep

# The syslog level for the logged policy rules.
LOG_LEVEL="info"
