description = "Simple traffic shaping on two interfaces (#48). eth0 is external with a 10mbit egress tbf and a 20mbit ingress police. eth1 has TYPE - and no bandwidths, so its prio qdisc is the root, nothing limits it, and its bands get no flow filter. Each interface gets its own qdisc handles: 1: and 101: for eth0, 2: for eth1. The tc state of both is compared against upstream. TYPE internal (flow key dst) is covered by tc-unit.py instead: cls_flow refuses the src and dst keys from a non-initial user namespace, which is where the sandbox runs."
family = 4
mode = "script"
tc_devices = ["eth0", "eth1"]

[[links]]
node_a = "server"
dev_a = "s0"
addr_a = "10.0.2.2/24"
node_b = "fw"
dev_b = "eth0"
addr_b = "10.0.2.1/24"

[[links]]
node_a = "client"
dev_a = "c0"
addr_a = "10.0.1.2/24"
node_b = "fw"
dev_b = "eth1"
addr_b = "10.0.1.1/24"

[routes]
server = "10.0.2.1"
client = "10.0.1.1"

[[probes]]
id = "loc-to-net-still-forwards"
from = "client"
to = "server"
addr = "10.0.2.2"
proto = "tcp"
port = 80
expect = "allow"
peer = "10.0.2.1"
