description = "IPSEC zone, site-to-site keyed by reqid. SSH from the tunnel peer is allowed, but the zone is scoped to the SA, so cleartext on the tunnel interface is not in the zone and is dropped. Matches upstream, whose -m policy match requires the same SA."
family = 4

[[links]]
node_a = "net"
dev_a = "s0"
addr_a = "10.0.2.2/24"
node_b = "fw"
dev_b = "eth0"
addr_b = "10.0.2.1/24"

[[links]]
node_a = "peer"
dev_a = "s0"
addr_a = "10.0.9.2/24"
node_b = "fw"
dev_b = "eth1"
addr_b = "10.0.9.1/24"

[routes]
net = "10.0.2.1"
peer = "10.0.9.1"

# Cleartext from the tunnel peer, no SA. The tun zone requires ipsec, so the
# ACCEPT rule does not match and the packet is dropped. Both compilers drop it.
[[probes]]
id = "cleartext-on-tunnel-iface-dropped"
from = "peer"
source = "10.0.9.2"
to = "fw"
addr = "10.0.9.1"
proto = "tcp"
port = 22
expect = "drop"
