site_name: shorewall-nft
site_description: >-
  Documentation for shorewall-nft, a Shorewall firewall compiler and runtime
  for nftables.
site_url: https://sol1.github.io/shorewall-nft/
repo_url: https://github.com/sol1/shorewall-nft
repo_name: sol1/shorewall-nft
edit_uri: edit/main/docs-site/docs/
copyright: >-
  shorewall-nft is developed by <a href="https://sol1.com.au">Sol1</a>.
  Shorewall is the work of Thomas M. Eastep and the Shorewall team.
  Distributed under the GPL.

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Two-interface firewall: getting-started/two-interface.md
