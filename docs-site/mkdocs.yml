site_name: shorewall-nft
site_description: >-
  Documentation for shorewall-nft, a Shorewall firewall compiler and runtime
  for nftables.
site_url: https://sol1.github.io/shorewall-nft/
repo_url: https://github.com/sol1/shorewall-nft
repo_name: sol1/shorewall-nft
edit_uri: edit/main/docs-site/docs/
copyright: >-
  shorewall-nft is developed by <a href="https://sol1.com.au">Sol1</a>.
  Shorewall is the work of Thomas M. Eastep and the Shorewall team.
  Distributed under the GPL.

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Standalone firewall: getting-started/standalone.md
      - Two-interface firewall: getting-started/two-interface.md
      - Three-interface firewall: getting-started/three-interface.md
  - How-to guides:
      - Port forwarding: how-to/port-forwarding.md
      - Masquerading and SNAT: how-to/masquerading.md
      - Redirecting a port: how-to/redirects.md
      - Rate limiting: how-to/rate-limiting.md
      - Logging: how-to/logging.md
      - Blacklisting: how-to/blacklisting.md
  - Reference:
      - Configuration files: reference/configuration-files.md
      - 'shorewall (command)': reference/shorewall.md
      - shorewall.conf: reference/shorewall-conf.md
      - zones: reference/zones.md
      - interfaces: reference/interfaces.md
      - policy: reference/policy.md
      - rules: reference/rules.md
      - snat: reference/snat.md
      - params: reference/params.md
